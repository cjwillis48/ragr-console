<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0f172a" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

		<!-- Open Graph / Twitter defaults. Per-route <svelte:head> blocks add
		     og:title / og:description / og:url where they need to differ.
		     og:image must be an absolute URL — Facebook + iMessage crawlers
		     do not resolve relative paths. -->
		<meta property="og:site_name" content="RAGr" />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="https://ragr.charliewillis.com/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="RAGr — RAG-as-a-Service for your apps" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://ragr.charliewillis.com/og.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
